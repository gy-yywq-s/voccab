name: Voccab
options:
  bundleIdPrefix: com.yywq.voccab
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  VocabKit:
    path: Packages/VocabKit

# Signing stays at Xcode defaults (automatic, no pinned team) so a fresh
# clone builds for simulator with zero setup and device builds only need
# picking a team in Signing & Capabilities. CI disables signing via
# xcodebuild flags instead of project settings.
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targetTemplates:
  VoccabApp:
    type: application
    platform: iOS
    dependencies:
      - package: VocabKit
    info:
      path: ${target_name}-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Pick photos to recognize and look up words."
        NSCameraUsageDescription: "Photograph text to recognize and look up words."
        ITSAppUsesNonExemptEncryption: false

targets:
  VoccabClassic:
    templates: [VoccabApp]
    sources:
      - path: Apps/Classic
      - path: Apps/Shared
      - path: Data/dict/voccab-dict.sqlite
        buildPhase: resources
      - path: Data/dict/voccab-extras.sqlite
        buildPhase: resources
      - path: Data/seed/sat_rw_vocab.csv
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yywq.voccab.classic
        INFOPLIST_KEY_CFBundleDisplayName: Voccab

  VoccabRedesign:
    templates: [VoccabApp]
    sources:
      - path: Apps/Redesign
      - path: Apps/Shared
      - path: Data/dict/voccab-dict.sqlite
        buildPhase: resources
      - path: Data/dict/voccab-extras.sqlite
        buildPhase: resources
      - path: Data/seed/sat_rw_vocab.csv
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yywq.voccab.neo
        INFOPLIST_KEY_CFBundleDisplayName: Voccab Neo

  # Native macOS front end: a note-taking workspace for collecting words.
  # Sources are Apps/Mac only — Apps/Shared imports UIKit and must never be
  # compiled here — plus the same bundled Data resources the iOS targets carry,
  # since MacEnvironment resolves them through Bundle.main exactly as
  # AppEnvironment does. VocabKit itself is pure Foundation and builds for
  # macOS 14 (see Package.swift's platforms list).
  VoccabMac:
    type: application
    platform: macOS
    dependencies:
      - package: VocabKit
    info:
      # Literal name: XcodeGen leaves ${target_name} unresolved in this
      # target's INFOPLIST_FILE, which broke the build with '-Info.plist'.
      path: VoccabMac-Info.plist
      properties:
        # Required for an AppKit-hosted SwiftUI app; without it the app has no
        # principal class to instantiate at launch.
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
    sources:
      - path: Apps/Mac
      - path: Data/dict/voccab-dict.sqlite
        buildPhase: resources
      - path: Data/dict/voccab-extras.sqlite
        buildPhase: resources
      - path: Data/seed/sat_rw_vocab.csv
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yywq.voccab.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_CFBundleDisplayName: Voccab Workspace
        # No entitlements file and no sandbox (the Xcode default): the draft
        # lives in Application Support and exports land wherever the save panel
        # is pointed.

  VoccabClassicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/Shared
      - UITests/Classic
    dependencies:
      - target: VoccabClassic
    settings:
      base:
        TEST_TARGET_NAME: VoccabClassic
        PRODUCT_BUNDLE_IDENTIFIER: com.yywq.voccab.classic.uitests

  VoccabRedesignUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/Shared
      - UITests/Redesign
    dependencies:
      - target: VoccabRedesign
    settings:
      base:
        TEST_TARGET_NAME: VoccabRedesign
        PRODUCT_BUNDLE_IDENTIFIER: com.yywq.voccab.neo.uitests

schemes:
  VoccabClassic:
    build:
      targets:
        VoccabClassic: all
    test:
      targets:
        - VoccabClassicUITests
      commandLineArguments:
        "-uitest": true
  VoccabRedesign:
    build:
      targets:
        VoccabRedesign: all
    test:
      targets:
        - VoccabRedesignUITests
      commandLineArguments:
        "-uitest": true
  # Build-only; CI never names this scheme, so the iOS jobs are unaffected.
  VoccabMac:
    build:
      targets:
        VoccabMac: all
